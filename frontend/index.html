<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback 360</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2713%27 fill=%27none%27 stroke=%27%231c1b18%27 stroke-width=%273%27/%3E%3Cpath d=%27M16 3a13 13 0 0 1 0 26%27 fill=%27%231c1b18%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M16 3a13 13 0 0 1 0 26" fill="currentColor"/>
        </svg>
        <span class="brand-name">Feedback 360</span>
      </div>

      <nav class="nav" id="sidebar-nav">
        <button type="button" class="nav-item" data-view="inicio"><i class="ti ti-home" aria-hidden="true"></i>Início</button>
        <button type="button" class="nav-item" data-view="feedbacks"><i class="ti ti-message-2" aria-hidden="true"></i>Feedbacks</button>
        <button type="button" class="nav-item" data-view="fatos"><i class="ti ti-file-text" aria-hidden="true"></i>Fatos</button>
        <button type="button" class="nav-item" data-view="plano"><i class="ti ti-layout-kanban" aria-hidden="true"></i>Plano de ação</button>
        <span class="nav-divider" aria-hidden="true"></span>
        <button type="button" class="nav-item" data-view="relatorios"><i class="ti ti-chart-bar" aria-hidden="true"></i>Relatórios</button>
        <button type="button" class="nav-item" data-view="equipes"><i class="ti ti-users-group" aria-hidden="true"></i>Equipes</button>
      </nav>

      <div class="sidebar-footer">
        <div class="user-switcher">
          <label class="user-switcher-label" for="usuario-ativo">Acessando como</label>
          <select id="usuario-ativo"></select>
          <div id="usuario-meta" class="user-meta"></div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div id="toasts" class="toast-container" aria-live="polite"></div>
      <div id="tela"></div>
    </main>
  </div>

  <div id="modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-titulo"></h2>
        <button type="button" class="icon-btn" data-action="fechar-modal" aria-label="Fechar" data-tip="Fechar">
          <i class="ti ti-x icon" aria-hidden="true"></i>
        </button>
      </div>
      <div id="modal-corpo" class="modal-body"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
